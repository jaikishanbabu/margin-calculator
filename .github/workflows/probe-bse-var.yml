name: probe-bse-var
on:
  push:
    branches: [probe-bse-var]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe BSE VaR / ELM page and file names
        run: |
          python3 - <<'PY'
          import re, urllib.request, http.cookiejar, html
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
               "Referer": "https://www.bseindia.com/", "Accept": "*/*"}
          def get(u):
              try:
                  r = op.open(urllib.request.Request(u, headers=H), timeout=40)
                  b = r.read(); return r.status, r.headers.get("content-type"), b
              except Exception as e:
                  return getattr(e, "code", "ERR"), str(e)[:80], b""
          get("https://www.bseindia.com/")
          import csv, io, collections
          st, ct, b = get("https://www.bseindia.com/BSEDATA/margins/ICCL00_VARELMAM_131126.csv")
          t = b.decode("utf-8", "replace").splitlines()
          print("ROWS", len(t)); print("HEADER", t[0])
          for l in t[1:6]: print("ROW", l)
          rows = list(csv.DictReader(io.StringIO("\n".join(t))))
          for k in rows[0]:
              vals = collections.Counter(r[k] for r in rows)
              print("COL", repr(k), "distinct", len(vals), "top", vals.most_common(6))
          for sym in ("RELIANCE", "TCS", "HDFCBANK", "INFY", "AARTISURF", "KHAZANCHI"):
              for r in rows:
                  if sym in (r.get("Security Name") or "").upper().replace(" ", "") or r.get("Security Code") in ("500325",):
                      print("SYM", sym, r); break
          for d in ["131126", "141126", "161126"]:
              for n in ["00", "01", "02", "03", "04", "05", "Final", "FINAL"]:
                  u = f"https://www.bseindia.com/BSEDATA/margins/ICCL{n}_VARELMAM_{d}.csv"
                  st, ct, b = get(u)
                  print("probe", st, len(b), u, b[:40] if st == 200 else "")
          for u in ["https://www.bseindia.com/BSEDATA/margins/", "https://www.bseindia.com/BSEDATA/margins/VAR161126.zip",
                    "https://www.bseindia.com/BSEDATA/margins/ICCL00_VARELMAM_161126.csv"]:
              st, ct, b = get(u); print("probe", st, ct, len(b), u)
          PY
