# Exchange file fetcher. Started by the engine (admin "Manually fetch" button, or the
# Supabase scheduler tick when auto fetch is on) via workflow_dispatch with a run id.
# Downloads from NSE / BSE / MCX, uploads each file to the engine, then parses the archived files
# into per-segment snapshots (Stage 2C) and uploads those too.
name: Exchange file fetcher

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Fetch run id created by the engine"
        required: true
      engine_url:
        description: "Address of the engine that created the run (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: exchange-fetcher
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engineFolder/requirements.txt }
      - run: pip install -r engineFolder/requirements.txt
      # Originals downloaded by earlier runs, keyed by SHA-256 and re-checked on read (build_job.cache_get).
      # Rebuilds then fetch only files they haven't seen, instead of every input every time.
      - name: Restore originals cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/margin-originals
          key: originals-${{ github.run_id }}
          restore-keys: originals-
      # Only known engine addresses receive the fetcher token (repo variables STAGING_URL / STAGING_URL_ALT).
      - name: Pick engine address
        env:
          ASKED: ${{ inputs.engine_url }}
          MAIN: ${{ vars.STAGING_URL }}
          ALT: ${{ vars.STAGING_URL_ALT }}
        run: |
          url="$MAIN"
          if [ -n "$ASKED" ] && { [ "$ASKED" = "$MAIN" ] || [ "$ASKED" = "$ALT" ]; }; then url="$ASKED"; fi
          [ -n "$ASKED" ] && [ "$ASKED" != "$url" ] && echo "::warning::engine_url $ASKED is not a known engine - using $url"
          echo "ENGINE_URL=$url" >> "$GITHUB_ENV"
      - name: Fetch exchange files (run ${{ inputs.run_id }})
        run: cd engineFolder && python -m app.fetch_job --run-id "${{ inputs.run_id }}"
        env:
          FETCHER_TOKEN: ${{ secrets.STAGING_FETCHER_TOKEN }}
          ORIGINALS_CACHE: ~/.cache/margin-originals
      - name: Prune originals cache (files unused for 10 days)
        if: always()
        run: find ~/.cache/margin-originals -type f -mtime +10 -delete 2>/dev/null || true
