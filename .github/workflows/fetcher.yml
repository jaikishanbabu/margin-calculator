# Exchange file fetcher. Started by the engine (admin "Manually fetch" button, or the
# Supabase scheduler tick when auto fetch is on) via workflow_dispatch with a run id.
# Downloads from NSE / BSE / MCX and uploads each file to the engine's upload pipeline.
name: Exchange file fetcher

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Fetch run id created by the engine"
        required: true

permissions:
  contents: read

concurrency:
  group: exchange-fetcher
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engineFolder/requirements.txt }
      - run: pip install -r engineFolder/requirements.txt
      - name: Fetch exchange files (run ${{ inputs.run_id }})
        run: cd engineFolder && python -m app.fetch_job --run-id "${{ inputs.run_id }}"
        env:
          ENGINE_URL: ${{ vars.STAGING_URL }}
          FETCHER_TOKEN: ${{ secrets.STAGING_FETCHER_TOKEN }}
