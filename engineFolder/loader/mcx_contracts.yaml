# MCX contract units, one row per commodity (DRAFT 29 Oct 2026; not used until approved).
#
#   lot          the trading unit, as MCX's contract specification states it
#   quote        the quotation / base value unit (prices in SPAN and the bhavcopy are per this)
#   multiplier   quotation units per lot = what 1 lot's SPAN risk array (per quote unit) is multiplied by
#   brokers      each broker's "lot" field in its instrument list, recorded here; the loader compares
#                them every day with the brokers' lists and, on a mismatch, logs a warning and leaves
#                that commodity unpriced
#   verified     true once checked against MCX's contract-specification page (source)
#
# Estimate column (comment): the multiplier implied by the 27/28 Oct bhavcopy (Value x 1e5 /
# (Volume x Close)), a cross-check only.

GOLD:
  lot: 1 kg
  quote: 10 grams
  multiplier: 100
  brokers: {zerodha: 1, angelone: 1}
  source: "MCX contract specification, Gold, August 2026 contract onwards (mcxindia.com/docs/default-source/products/contract-specification/gold/gold-august-2026-contract-onwards...pdf): Trading Unit 1 kg; Quotation/Base Value 10 grams; tick Re 1 per 10 grams"
  verified: true            # bhavcopy estimate 100.0
CRUDEOIL:
  lot: 100 barrels
  quote: 1 barrel
  multiplier: 100
  brokers: {zerodha: 100, angelone: 100}
  source: "MCX contract specification, Crude Oil, January 2026 contract onwards (mcxindia.com/docs/default-source/products/contract-specification/crude-oil/crude-oil-january-2026-contract-onwards...pdf): Trading Unit 100 barrels; Quotation Rs per barrel; tick Re 1"
  verified: true            # estimate 99.99

