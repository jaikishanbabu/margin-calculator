# Broker reference baskets for the NFO engine: Zerodha (zerodha.com/margin-calculator/SPAN/)
# and Angel One (angelone.in margin calculator).
#
# How to capture (Zerodha set planned for Tue 27 Oct 2026, NIFTY's and the stocks' monthly expiry)
#   - Keep the agent running all day (logs/agent.log) so every SPAN cycle is
#     saved in data/NFO/span/<date>/.
#   - Enter each basket on the broker's calculator exactly as listed here; fill in the nulls.
#   - captured_at: the IST time you read the numbers, "YYYY-MM-DD HH:MM". The
#     test loads the SPAN cycle live at that time with that day's files.
#   - expected: copy SPAN, Exposure and Total exactly as shown; optional
#     net_premium (as shown, negative = received) and benefit (sum of the legs
#     alone - basket). A leg may carry its own `expected` {span, exposure, total}:
#     that leg margined on its own.
#   - broker: zerodha | angelone
#   - The test tries the cycle live at captured_at first, then every earlier cycle
#     (that day's and the previous day's), and passes on the first that matches,
#     printing which file the broker was on. Brokers lag: Angel One was on Monday's
#     i1 at 19:45 Monday and on Monday's final file at 01:14 Tuesday.
#   - span_cycle (optional): check against this cycle of the capture day only.
#   - Rules come from loader/static_rates.yaml (span_less_net_option_value = 1).
#
# Legs (all NSE / NFO)
#   symbol   NSE symbol (NIFTY, RELIANCE)
#   expiry   YYYY-MM-DD as listed by NSE (prefilled from the contract data; change
#            it if you pick another expiry on the broker's calculator)
#   type     CE | PE | FUT
#   strike   for CE/PE; null for FUT
#   side     buy | sell
#   qty      units, i.e. lots x lot size (NIFTY 65, RELIANCE 500); the test
#            checks it is a whole number of lots
#
# A basket with any null is reported as pending, not failed. When a basket
# matches, flip the static_rates.yaml rules listed under `checks` to verified: true.

tolerance_pct: 0.05         # allowed difference on each figure, % of the broker's value. Keep it tight:
                            # consecutive SPAN cycles can differ by under 0.5%
tolerance_abs: 5            # ... or this many rupees, whichever is larger

baskets:
  - id: naked_short_index_call
    broker: zerodha
    what: sell one NIFTY call near the money, weekly expiry (not the one expiring that day)
    checks: [index_elm.OTH 2%, short_option_elm_on_underlying, span_less_net_option_value]
    captured_at: null
    legs:
      - {symbol: NIFTY, expiry: 2026-11-03, type: CE, strike: null, side: sell, qty: null}
    expected: {span: null, exposure: null, total: null}

  - id: hedged_put_spread
    broker: zerodha
    what: NIFTY put credit spread - sell the higher strike, buy a lower strike, same expiry
    checks: [span_less_net_option_value, hedge benefit, ELM only on the short leg]
    captured_at: null
    legs:
      - {symbol: NIFTY, expiry: 2026-11-03, type: PE, strike: null, side: sell, qty: null}
      - {symbol: NIFTY, expiry: 2026-11-03, type: PE, strike: null, side: buy, qty: null}
    expected: {span: null, exposure: null, total: null}

  - id: nifty_nov_dec_calendar
    broker: zerodha
    what: NIFTY futures calendar - buy November, sell December
    checks: [calendar spread charge (SPAN dSpread), calendar_spread_far_leg_elm_fraction]
    captured_at: null
    legs:
      - {symbol: NIFTY, expiry: 2026-11-23, type: FUT, strike: null, side: buy, qty: null}
      - {symbol: NIFTY, expiry: 2026-12-29, type: FUT, strike: null, side: sell, qty: null}
    expected: {span: null, exposure: null, total: null}

  - id: deep_otm_reliance_short_call
    broker: zerodha
    what: sell a RELIANCE November call more than 30% above Monday 26 Oct's close
      (close x 1.30; with RELIANCE near 1,200 that means a strike of 1,600 or more)
    checks: [stock_deep_otm_pct 30%, ael OTM row 5.25%]
    captured_at: null
    legs:
      - {symbol: RELIANCE, expiry: 2026-11-23, type: CE, strike: null, side: sell, qty: null}
    expected: {span: null, exposure: null, total: null}

  - id: expiry_day_call_and_future
    broker: zerodha
    what: on 27 Oct, sell a NIFTY call expiring that day, plus a NIFTY November future
    checks: [expiry_day_short_index_option_extra_pct, SPAN expiry-day scan tiers (27 Oct in its own tier)]
    captured_at: null       # must be on 2026-10-27
    legs:
      - {symbol: NIFTY, expiry: 2026-10-27, type: CE, strike: null, side: sell, qty: null}
      - {symbol: NIFTY, expiry: 2026-11-23, type: FUT, strike: null, side: null, qty: null}   # buy or sell
    expected: {span: null, exposure: null, total: null}

  - id: long_index_call
    broker: zerodha
    what: buy one NIFTY call, weekly expiry (not the one expiring that day)
    checks: [span_less_net_option_value - 0 shows about the premium as SPAN, 1 shows 0]
    captured_at: null
    legs:
