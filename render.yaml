# Render Blueprint - STAGING ONLY (branch: develop).
# Production is added in Stage 6, deploying from `main` only after an approved PR.
#
# Secrets marked `sync: false` are typed into Render's dashboard by the owner when the Blueprint is created;
# `generateValue` secrets are created by Render. None are stored in this repository or shared in chat.
services:
  - type: web
    name: margin-engine-staging
    runtime: python
    plan: free
    region: singapore
    branch: develop
    autoDeploy: true
    buildCommand: pip install -r engineFolder/requirements.txt
    startCommand: cd engineFolder && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: staging
      - key: SERVE_STATIC
        value: "1"
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        value: https://nlubvmkdvrjgsvvxfvxm.supabase.co
      - key: SUPABASE_BUCKET
        value: margin-archive
      - key: SUPERADMIN_USERNAME
        value: superadmin
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL          # restricted margin_app login via the Supabase session pooler
        sync: false
      - key: SUPABASE_SERVICE_KEY  # Supabase secret key (storage only)
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: OPS_TOKEN             # generated by Render; copy it into the GitHub secret STAGING_OPS_TOKEN
        generateValue: true
