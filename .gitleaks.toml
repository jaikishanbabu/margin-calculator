# Use gitleaks' default rules; allow only the throw-away credentials used by CI/test fixtures.
[extend]
useDefault = true

[allowlist]
description = "Disposable test-only values (CI Postgres container, unit-test fixtures)"
regexes = [
  '''ci-owner-pass''',
  '''ci-app-pass''',
  '''test-ops-token-[0-9a-f]+''',
  '''Test-Super-Pass-123!''',
  '''test-service-key''',
  '''Smoke-Test-Pass-1!''',
  '''Temp-Pass-2026-ok''',
  '''A-Brand-New-Pass-2026''',
  '''Upload-Desk-2026!''',
  '''New-Desk-Pass-9!''',
  '''Bob-Pass-2026!x''',
  '''Rotated-''',
]
